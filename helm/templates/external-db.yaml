# 클러스터 밖의 MySQL / Redis 를 k8s 네이티브 이름으로 감싸는 레이어.
# 로컬(kind): selector 없는 Service + EndpointSlice(external-db-endpoints.yaml)
# EKS:       아래 Service 를 ExternalName 타입으로 교체하면 EndpointSlice 불필요
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "study.labels" . | nindent 4 }}
spec:
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "study.labels" . | nindent 4 }}
spec:
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
      protocol: TCP